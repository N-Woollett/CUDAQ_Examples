[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "readout_classifier_demo"
version = "0.1.0"
description = "Superconducting qubit readout classifier demo"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["readout_classifier*"]

[tool.pytest.ini_options]
testpaths = ["readout_classifier/tests"]
